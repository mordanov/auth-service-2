name: CI/CD — auth-app

on:
  push:
    branches: [main, "001-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    # conftest.py sets DATABASE_URL and SECRET_KEY via os.environ.setdefault before any
    # backend module loads. All other Settings fields have defaults. No env block needed.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # pytest.ini is at repo root: testpaths=tests, pythonpath=backend
      - name: Run tests with coverage
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Node LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_AUTH_DIR: ${{ secrets.VPS_AUTH_DIR }}
          VPS_WEB_FOLDERS_DIR: ${{ secrets.VPS_WEB_FOLDERS_DIR }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -se -- '$REPO' '$REF_NAME' '$VPS_AUTH_DIR' '$VPS_WEB_FOLDERS_DIR'" << 'EOF'

          set -e

          REPO="$1"
          REF_NAME="$2"
          AUTH_DIR="${3:-$HOME/auth-app}"
          WEB_FOLDERS_DIR="${4:-$HOME/web-folders}"

          PREVIOUS_COMMIT=""

          # --- Update auth-app repo ---
          mkdir -p "$AUTH_DIR"
          cd "$AUTH_DIR"

          if [ ! -d .git ]; then
            git clone "https://github.com/$REPO.git" .
          fi

          PREVIOUS_COMMIT=$(git rev-parse HEAD || echo "")

          git fetch origin --prune
          git checkout "$REF_NAME"
          git reset --hard "origin/$REF_NAME"

          # --- Update web-folders infra repo ---
          if [ ! -d "$WEB_FOLDERS_DIR/.git" ]; then
            echo "web-folders repo is missing at $WEB_FOLDERS_DIR"
            echo "Clone web-folders on VPS once, then rerun deployment"
            exit 1
          fi

          cd "$WEB_FOLDERS_DIR"
          git fetch origin --prune

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout main
            git reset --hard origin/main
          else
            git pull --ff-only
          fi

          # --- Sanity-check that auth services exist in this compose config ---
          if ! docker compose config --services | grep -qx "auth-backend"; then
            echo "web-folders config is missing auth-backend service"
            echo "Ensure web-folders docker-compose.yaml defines auth-backend and auth-frontend"
            exit 1
          fi

          AUTH_HTTP_HOST="${AUTH_PRIMARY_DOMAIN:-auth.mainpage.com}"

          debug_dump() {
            docker compose ps || true
            docker compose logs --no-color --tail=200 auth-backend || true
            docker compose logs --no-color --tail=200 auth-frontend || true
            docker compose logs --no-color --tail=200 nginx || true
          }

          wait_for_auth_health() {
            local retries=60
            local delay=2

            echo "Waiting for auth service via nginx (Host: ${AUTH_HTTP_HOST})..."
            for ((i=1; i<=retries; i++)); do
              if curl -fsS -H "Host: ${AUTH_HTTP_HOST}" http://localhost/health > /dev/null 2>&1; then
                echo "Health check passed"
                return 0
              fi
              sleep "$delay"
            done

            echo "Health check failed after $((retries * delay))s"
            return 1
          }

          # --- Build images ---
          echo "Building containers..."
          docker compose build auth-backend auth-frontend nginx

          # --- Apply database migrations before switching traffic ---
          echo "Running database migrations..."
          docker compose run --rm auth-backend alembic upgrade head

          # --- Start services ---
          docker compose up -d --remove-orphans

          if ! wait_for_auth_health; then
            echo "Health check failed -> rollback"
            debug_dump

            if [ -n "$PREVIOUS_COMMIT" ]; then
              cd "$AUTH_DIR"
              git reset --hard "$PREVIOUS_COMMIT"
              cd "$WEB_FOLDERS_DIR"
              docker compose build auth-backend auth-frontend nginx
              docker compose up -d --remove-orphans

              if wait_for_auth_health; then
                echo "Rollback recovered service successfully"
              else
                echo "Rollback completed, but service is still unhealthy"
                debug_dump
              fi
            fi

            exit 1
          fi

          docker compose ps
          EOF

      - name: Deploy notification
        if: success()
        run: echo "Deployment to ${{ secrets.VPS_HOST }} completed successfully."

      - name: Deploy failed notification
        if: failure()
        run: echo "Deployment failed."

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   VPS_SSH_KEY           — Private SSH key for deployment server access
#   VPS_HOST              — Deployment server hostname or IP
#   VPS_USER              — SSH username on deployment server
#   VPS_PORT              — SSH port (default: 22)
#   VPS_AUTH_DIR          — Path to auth-app repo on VPS (e.g. /opt/auth-app)
#   VPS_WEB_FOLDERS_DIR   — Path to web-folders repo on VPS (e.g. /opt/web-folders)
#
# All runtime secrets live in web-folders/.env on the VPS (AUTH_* prefix):
#   AUTH_POSTGRES_DB, AUTH_POSTGRES_USER, AUTH_POSTGRES_PASSWORD
#   AUTH_SECRET_KEY
#   AUTH_ADMIN_USERNAME, AUTH_ADMIN_PASSWORD
#   AUTH_USER1_USERNAME, AUTH_USER1_PASSWORD
#   AUTH_USER2_USERNAME, AUTH_USER2_PASSWORD
#   AUTH_GOOGLE_CLIENT_ID, AUTH_GOOGLE_CLIENT_SECRET
#   AUTH_GITHUB_CLIENT_ID, AUTH_GITHUB_CLIENT_SECRET
#   AUTH_PRIMARY_DOMAIN, AUTH_SERVER_NAMES
#   AUTH_COOKIE_DOMAIN, AUTH_ALLOWED_ORIGINS
# ──────────────────────────────────────────────────────────────────────────────
