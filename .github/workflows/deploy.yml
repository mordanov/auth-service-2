name: CI/CD — auth-app

on:
  push:
    branches: [main, "001-*"]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest

    # Tests use in-memory SQLite via conftest.py — no database service needed.
    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      TOKEN_TTL_HOURS: "24"
      SECRET_KEY: "ci_test_secret_key_replace_in_production_abcdef0123456789"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin_test_pass
      USER1_USERNAME: user1
      USER1_PASSWORD: user1_test_pass
      USER2_USERNAME: user2
      USER2_PASSWORD: user2_test_pass
      GOOGLE_CLIENT_ID: "ci-placeholder"
      GOOGLE_CLIENT_SECRET: "ci-placeholder"
      GOOGLE_REDIRECT_URI: "https://auth.mainpage.com/api/auth/callback/google"
      GITHUB_CLIENT_ID: "ci-placeholder"
      GITHUB_CLIENT_SECRET: "ci-placeholder"
      GITHUB_REDIRECT_URI: "https://auth.mainpage.com/api/auth/callback/github"
      AUTH_APP_URL: "https://auth.mainpage.com"
      COOKIE_DOMAIN: ".mainpage.com"
      ENVIRONMENT: "development"
      ALLOWED_ORIGINS: "https://auth.mainpage.com"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      # Tests use in-memory SQLite (conftest.py), so no migration needed in CI.
      # Alembic upgrade head is verified separately in the deploy job against the real DB.

      - name: Run tests with coverage
        # pytest.ini is at repo root: testpaths=tests, pythonpath=backend
        run: pytest --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests (Node LTS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ────────────────────────────────────────────────────────────────────────────
  build-and-deploy:
    name: Build & Deploy
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Verify production environment config
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/auth-app
            # ENVIRONMENT=production is required so cookies are Secure
            ENV_VAL=$(grep -E '^ENVIRONMENT=' .env | cut -d= -f2 | tr -d '[:space:]')
            if [ "$ENV_VAL" != "production" ]; then
              echo "ERROR: .env must set ENVIRONMENT=production for deployed instances (got: '$ENV_VAL')" >&2
              exit 1
            fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-app-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/auth-app-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-app-frontend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/auth-app-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/auth-app

            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-app-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/auth-app-frontend:latest

            # Apply database migrations before starting new containers
            docker run --rm \
              --network web-folders_default \
              --env-file .env \
              ${{ secrets.DOCKER_USERNAME }}/auth-app-backend:latest \
              alembic upgrade head

            # Restart services
            docker compose up -d --no-build

            # Health check
            sleep 5
            curl -f https://auth.mainpage.com/health || (docker compose logs auth-app-backend && exit 1)

      - name: Notify deployment complete
        if: success()
        run: echo "Deployment of ${{ github.sha }} to auth.mainpage.com succeeded."

# ──────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   DEPLOY_SSH_KEY        — Private SSH key for deployment server access
#   DEPLOY_HOST           — Deployment server hostname or IP
#   DEPLOY_USER           — SSH username on deployment server
#   DOCKER_USERNAME       — Docker registry username
#   DOCKER_PASSWORD       — Docker registry password / token
#
# Sensitive runtime secrets (injected via .env on the server, NOT stored in CI):
#   SECRET_KEY, DATABASE_URL, ADMIN_PASSWORD, USER*_PASSWORD
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET
# ──────────────────────────────────────────────────────────────────────────────
