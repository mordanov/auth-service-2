##
## Nginx server block for auth.mainpage.com
## Place in the web-folders nginx sites-enabled/ directory.
##
## Upstream auth-app-backend must be reachable on the web-folders_default
## Docker network. Adjust the upstream host/port if your compose naming differs.
##

server {
    listen 443 ssl;
    server_name auth.mainpage.com;

    ssl_certificate     /etc/letsencrypt/live/auth.mainpage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.mainpage.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to FastAPI backend
    location /api/ {
        proxy_pass         http://auth-app-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Ensure Set-Cookie responses from FastAPI are forwarded correctly
        proxy_pass_header  Set-Cookie;
    }

    # Health check endpoint (FastAPI)
    location /health {
        proxy_pass         http://auth-app-backend:8000/health;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        access_log         off;
    }

    # OpenAPI docs (FastAPI)
    location /docs {
        proxy_pass         http://auth-app-backend:8000/docs;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass         http://auth-app-backend:8000/openapi.json;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # React SPA frontend (served by auth-app-frontend nginx container)
    location / {
        proxy_pass         http://auth-app-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name auth.mainpage.com;
    return 301 https://$host$request_uri;
}
