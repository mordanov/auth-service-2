##
## Example Nginx server block for a protected application (e.g. budget-site).
## Add proxy_cookie_domain so the shared auth_token cookie issued at
## auth.mainpage.com is sent to *.mainpage.com subdomains.
##
## Copy and adapt this block for each of the 8 protected applications.
## Replace:
##   - budget.mainpage.com  → the application's subdomain
##   - budget-site:3000     → the application's Docker service name + port
##

server {
    listen 443 ssl;
    server_name budget.mainpage.com;

    ssl_certificate     /etc/letsencrypt/live/budget.mainpage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budget.mainpage.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass         http://budget-site:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # REQUIRED: rewrite the Set-Cookie domain so the auth_token cookie
        # issued by auth.mainpage.com is forwarded by the browser on all
        # *.mainpage.com subdomains, including this application.
        proxy_cookie_domain auth.mainpage.com .mainpage.com;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name budget.mainpage.com;
    return 301 https://$host$request_uri;
}

##
## Protected application identifiers and their subdomains:
##
##   budget-site             → budget.mainpage.com
##   family-admin-routine    → family-admin.mainpage.com (example)
##   family-archive          → archive.mainpage.com (example)
##   family-kitchen-recipes  → kitchen.mainpage.com (example)
##   new-site                → new.mainpage.com (example)
##   portuguese-expenses     → expenses.mainpage.com (example)
##   reminders-app           → reminders.mainpage.com (example)
##   servinga-dashboard      → servinga.mainpage.com (example)
##
## Adjust subdomain names to match your actual DNS records.
##
